<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      body { margin: 0; padding: 18px; font-size: 13px; color: #202124; background: #fff; }
      h3 { margin: 0 0 12px 0; font-size: 15px; color: #1a73e8; }
      p { margin: 0 0 14px 0; font-size: 12px; color: #5f6368; line-height: 1.4; }
      
      .snapshot-item {
        border: 1px solid #dadce0;
        border-radius: 6px;
        padding: 10px 12px;
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #f8f9fa;
      }
      .snapshot-info { flex: 1; margin-right: 10px; }
      .snapshot-title { font-weight: 600; font-size: 13px; color: #202124; margin-bottom: 2px; }
      .snapshot-time { font-size: 11px; color: #5f6368; }
      
      .btn-revert {
        padding: 6px 12px;
        background: #d93025;
        color: #fff;
        border: none;
        border-radius: 4px;
        font-weight: 600;
        cursor: pointer;
        font-size: 12px;
        white-space: nowrap;
      }
      .btn-revert:hover { background: #b3261e; }
      .btn-revert:disabled { background: #dadce0; cursor: not-allowed; }

      .empty-state { text-align: center; padding: 30px 10px; color: #80868b; }
      
      #loadingOverlay {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(255, 255, 255, 0.9);
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .spinner {
        width: 32px; height: 32px;
        border: 3px solid #f3f3f3;
        border-top: 3px solid #d93025;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 10px;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="loadingOverlay">
      <div class="spinner"></div>
      <div style="font-size: 13px; font-weight: 600;">Reverting snapshot...</div>
    </div>

    <h3>Available Snapshots (Max 5)</h3>
    <p>Select a snapshot to reverse its workout block additions, restore dates/statuses, and re-sort the Dashboard.</p>

    <div id="snapshotList"></div>

    <script>
      function loadList() {
        google.script.run
          .withSuccessHandler(renderSnapshots)
          .withFailureHandler(err => alert("Error: " + err.message))
          .getSnapshotsList();
      }

      function renderSnapshots(list) {
        const container = document.getElementById('snapshotList');
        if (!list || list.length === 0) {
          container.innerHTML = '<div class="empty-state">No saved snapshots available.</div>';
          return;
        }

        container.innerHTML = list.map((s, idx) => `
          <div class="snapshot-item">
            <div class="snapshot-info">
              <div class="snapshot-title">${s.title}</div>
              <div class="snapshot-time">${idx === 0 ? 'Latest Snapshot' : 'Earlier Snapshot'}</div>
            </div>
            <button class="btn-revert" onclick="revert('${s.id}')">Reverse</button>
          </div>
        `).join('');
      }

      function revert(id) {
        if (!confirm("Are you sure you want to reverse this confirmation?")) return;
        document.getElementById('loadingOverlay').style.display = 'flex';
        google.script.run
          .withSuccessHandler(res => {
            document.getElementById('loadingOverlay').style.display = 'none';
            if (res.error) {
              alert(res.error);
            } else {
              alert("Reversed successfully:\n" + res.reversedTitle);
              google.script.host.close();
            }
          })
          .withFailureHandler(err => {
            document.getElementById('loadingOverlay').style.display = 'none';
            alert("Error: " + err.message);
          })
          .reverseSnapshotById(id);
      }

      loadList();
    </script>
  </body>
</html>
